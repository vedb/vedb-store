[paths]
# Directory where vedb session folders are stored. Leave empty to use
# `base_dir` from the vedb-gaze config (~/.config/vedb-gaze/options.cfg).
vedb_directory=
# Used if you are syncing partial versions of vedb to your machine
# and also have mounted (slower) access elsewhere. Rare, safe to ignore.
sync_directory=
# Directory where processed gaze and odometry files are stored. Leave empty
# to use `proc_dir` from the vedb-gaze config.
proc_directory=
# Directory where ClipList samples are saved by default (empty: current
# directory)
sample_directory=
